version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: captcha_benchmark
      POSTGRES_USER: cb_user
      POSTGRES_PASSWORD: cb_password
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cb_user -d captcha_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://cb_user:cb_password@db:5432/captcha_benchmark
      SYNC_DATABASE_URL: postgresql://cb_user:cb_password@db:5432/captcha_benchmark
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-32chars
      ENVIRONMENT: development
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/storage
    volumes:
      - ./api:/app
      - ./api/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: /app/docker-entrypoint.sh
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8888:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cb_user:cb_password@db:5432/captcha_benchmark
      SYNC_DATABASE_URL: postgresql://cb_user:cb_password@db:5432/captcha_benchmark
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      ENVIRONMENT: development
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/storage
    volumes:
      - ./api:/app
      - ./api/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://cb_user:cb_password@db:5432/captcha_benchmark
      SYNC_DATABASE_URL: postgresql://cb_user:cb_password@db:5432/captcha_benchmark
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-32chars
      ENVIRONMENT: development
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/storage
    volumes:
      - ./api:/app
      - ./api/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m app.workers.runner

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps --silent && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:4000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pg_data:
